name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  provjere:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Testcontainers podiže Postgres u Dockeru (dostupan na ubuntu runnerima)
      - run: npm run test:db
      - run: npm run build
      - run: docker build -f docker/Dockerfile --target aplikacija .
