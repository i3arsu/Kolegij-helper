# Samo baza za lokalni razvoj: docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_OWNER_PASS: ${APP_OWNER_PASS}
      APP_USER_PASS: ${APP_USER_PASS}
      APP_AUTH_PASS: ${APP_AUTH_PASS}
      TZ: Europe/Zagreb
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30
volumes:
  pgdata-dev: {}
