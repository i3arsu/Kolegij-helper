# Produkcija: docker compose up -d --build
# Prije prvog pokretanja: kopiraj .env.example u .env i postavi sve vrijednosti (vidi README).
name: pracenje


services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      APP_OWNER_PASS: ${APP_OWNER_PASS:?}
      APP_USER_PASS: ${APP_USER_PASS:?}
      APP_AUTH_PASS: ${APP_AUTH_PASS:?}
      TZ: Europe/Zagreb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pracenje"]
      interval: 5s
      retries: 30
    # Bez objavljenog porta: baza je dostupna samo unutar Docker mreže.

  migracije:
    build: { context: ., dockerfile: docker/Dockerfile, target: alati }
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      APP_OWNER_PASS: ${APP_OWNER_PASS}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    build: { context: ., dockerfile: docker/Dockerfile, target: aplikacija }
    restart: unless-stopped
    environment:
      # URL-ove gradi lib/db/url.ts; app ne dobiva lozinku vlasnika baze
      DB_HOST: db
      DB_PORT: "5432"
      APP_USER_PASS: ${APP_USER_PASS}
      APP_AUTH_PASS: ${APP_AUTH_PASS}
      QR_TAJNA: ${QR_TAJNA:?}
      APP_URL: ${APP_URL:?}
    volumes:
      - datoteke:/data/datoteke
    depends_on:
      migracije: { condition: service_completed_successfully }

  proxy:
    image: caddy:2.10
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMENA: ${DOMENA:?}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

volumes:
  pgdata: {}
  datoteke: {}
  caddy_data: {}
  caddy_config: {}
